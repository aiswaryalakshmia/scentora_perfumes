<div class="image-upload-component" id="category-image-upload">
    <div class="form-group">
        <input
            type="file"
            class="image-input"
            accept="image/*">
    </div>

    <div class="preview-container preview-grid"></div>

    <input
        type="hidden"
        name="cropped_image"
        class="cropped-images-input">    
    <span class="warning"><i class="fa-solid fa-circle-exclamation"></i> Crop the image before saving.</span>
</div>
