{% extends 'admin_base.html' %}
{% load static %}

{% block title %}Add Coupon{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'admin/offer_management.css' %}">
{% endblock %}

{% block content %}
<div class="offer-form-page">

  <div class="form-header">
    <h1>Create Coupon</h1>
    <a href="{% url 'coupon_management' %}" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to Coupons
    </a>
  </div>

  <form method="POST" novalidate>
    {% csrf_token %}
    <div class="form-layout">

      <!-- Left Column -->
      <div>
        <div class="form-card">
          <h2>Coupon Details</h2>

          <div class="form-row">
            <div class="form-group">
              <label for="coupon_code">Coupon Code</label>
              <input type="text" id="coupon_code" name="coupon_code"
                     placeholder="e.g. SAVE100"
                     style="text-transform:uppercase;"
                     value="{{ request.POST.coupon_code|default:'' }}"
                     required>
            </div>
            <div class="form-group">
              <label for="discount_type">Discount Type</label>
              <select id="discount_type" name="discount_type" required>
                <option value="">Select type...</option>
                <option value="percentage" {% if request.POST.discount_type == 'percentage' %}selected{% endif %}>Percentage (%)</option>
                <option value="flat" {% if request.POST.discount_type == 'flat' %}selected{% endif %}>Flat Amount (₹)</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="discount_value">Discount Value</label>
              <input type="number" id="discount_value" name="discount_value"
                     placeholder="e.g. 10 or 100"
                     min="1" step="0.01"
                     value="{{ request.POST.discount_value|default:'' }}"
                     required>
            </div>
            <div class="form-group">
              <label for="usage_limit">Usage Limit</label>
              <input type="number" id="usage_limit" name="usage_limit"
                     placeholder="e.g. 100"
                     min="1"
                     value="{{ request.POST.usage_limit|default:'1' }}"
                     required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="minimum_price">Minimum Order Amount (₹)</label>
              <input type="number" id="minimum_price" name="minimum_price"
                     placeholder="e.g. 500"
                     min="0" step="0.01"
                     value="{{ request.POST.minimum_price|default:'0' }}">
            </div>
            <div class="form-group">
              <label for="maximum_redeem">Maximum Redeem Amount (₹)</label>
              <input type="number" id="maximum_redeem" name="maximum_redeem"
                     placeholder="Leave empty for no cap"
                     min="0" step="0.01"
                     value="{{ request.POST.maximum_redeem|default:'' }}">
            </div>
          </div>

        </div>
      </div>

      <!-- Right Sidebar -->
      <div>
        <div class="sidebar-card">
          <h2>Validity</h2>

          <div class="form-group">
            <label for="expiry_date">Expiry Date</label>
            <input type="date" id="expiry_date" name="expiry_date"
                   value="{{ request.POST.expiry_date|default:'' }}"
                   required>
          </div>

          <button type="submit" class="btn-create">Create Coupon</button>
          <a href="{% url 'coupon_management' %}" class="btn-cancel">Cancel</a>
        </div>
      </div>

    </div>
  </form>

</div>
{% endblock %}
